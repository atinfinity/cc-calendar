# Project site, published to https://atinfinity.github.io/cc-calendar/ by .github/workflows/docs.yml.
# Preview locally with `uv run --group docs zensical serve`.
[project]
site_name = "cc-calendar"
site_url = "https://atinfinity.github.io/cc-calendar/"
site_description = "A Google Calendar-style view of your Claude Code sessions"
site_author = "atinfinity"
copyright = "Copyright &copy; 2026 atinfinity · MIT License"
repo_url = "https://github.com/atinfinity/cc-calendar"
repo_name = "atinfinity/cc-calendar"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Features" = "features.md" },
  { "Privacy" = "privacy.md" },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
favicon = "assets/favicon.svg"
logo = "assets/logo.svg"
features = [
  "content.code.copy",
  "content.action.edit",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/atinfinity/cc-calendar"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
