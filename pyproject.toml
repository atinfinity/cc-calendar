[project]
name = "cc-calendar"
version = "0.3.0"
description = "Google Calendar-style weekly view of your Claude Code sessions"
readme = "README.md"
license = "MIT"
authors = [
    { name = "atinfinity", email = "dandelion1124@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[project.scripts]
cc-calendar = "cc_calendar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
docs = [
    "zensical>=0.0.67",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
