<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cc-calendar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='2' width='14' height='13' rx='2' fill='%23d97757'/><rect x='3' y='6' width='4' height='3' fill='white'/><rect x='9' y='9' width='4' height='4' fill='white'/></svg>">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">cc-calendar</div>
    <div class="seg" id="view-toggle">
      <button data-view="calendar" title="Calendar (c)">Calendar</button>
      <button data-view="list" title="List (l)">List</button>
    </div>
    <span class="search-box">
      <input id="search" type="search" placeholder="Search sessions…" title="Search titles, prompts, notes and tags (/)" autocomplete="off">
      <span class="muted ft-status" id="full-text-status" aria-live="polite"></span>
    </span>
    <label class="check" title="Also search Claude's replies, tool calls and tool output, subagents included (at least 3 characters)"><input type="checkbox" id="full-text"> Full text</label>
    <div class="dropdown" id="project-filter">
      <button class="dropdown-btn" id="project-btn">All projects ▾</button>
      <div class="dropdown-menu" id="project-menu" hidden></div>
    </div>
    <div class="chips" id="status-chips"></div>
    <label class="check" title="Hide sessions with no prompts"><input type="checkbox" id="hide-noprompt"> With prompts only</label>
    <div class="spacer"></div>
    <button id="notify-toggle">Notify</button>
    <span class="live" id="live-indicator" title="Live updates">● live</span>
    <button id="reload" title="Reload">Reload</button>
    <button id="help-btn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
  </header>

  <main class="layout">
    <section class="main-pane">
      <div id="calendar-view">
        <div class="toolbar">
          <div class="seg small" id="span-toggle">
            <button data-span="day" title="Day (d)">Day</button>
            <button data-span="week" title="Week (w)">Week</button>
            <button data-span="month" title="Month (m)">Month</button>
            <button data-span="year" title="Year (y)">Year</button>
          </div>
          <button id="go-today" title="Go to the current day, week, month or year (t)">This week</button>
          <button id="go-prev" aria-label="Previous" title="Previous (←)">◀</button>
          <button id="go-next" aria-label="Next" title="Next (→)">▶</button>
          <span class="range" id="range-label"></span>
          <span class="muted" id="range-count"></span>
          <button id="summary-toggle" title="Active time and cost per project">Summary</button>
          <button id="tools-toggle" title="Tool calls, errors, MCP servers and subagents in the displayed range">Tools</button>
          <button id="hours-toggle" title="Active time, cost and commits by weekday and hour of day in the displayed range">Hours</button>
          <button id="copy-report" title="Copy the displayed range as Markdown: time and cost per project, sessions and commits">Copy report</button>
          <div class="seg small" id="zoom">
            <button id="zoom-out" aria-label="Zoom out">−</button>
            <button id="zoom-in" aria-label="Zoom in">+</button>
            <button id="zoom-reset">Reset</button>
          </div>
          <span class="muted" id="color-by-label">Color by</span>
          <div class="seg small" id="color-by">
            <button data-color="project">Project</button>
            <button data-color="status">Status</button>
            <button data-color="model">Model</button>
            <button data-color="effort">Effort</button>
            <button data-color="cost">Cost</button>
            <button data-color="source" title="The Claude config directory each session was read from" hidden>Source</button>
            <button data-color="tag" title="The session's first tag" hidden>Tag</button>
          </div>
          <label class="muted">Split after
            <select id="gap">
              <option value="5">5 min</option>
              <option value="10">10 min</option>
              <option value="15">15 min</option>
              <option value="30">30 min</option>
              <option value="60">60 min</option>
            </select>
            idle</label>
        </div>
        <div class="legend" id="legend"></div>
        <div class="summary" id="summary" hidden></div>
        <div class="summary tools-pane" id="tools-pane" hidden></div>
        <div class="summary hours-pane" id="hours-pane" hidden></div>
        <div class="calendar" id="calendar"></div>
      </div>
      <div id="list-view" hidden>
        <div class="toolbar">
          <span class="muted" id="list-count"></span>
          <span class="muted">Click a column header to sort</span>
          <div class="spacer"></div>
          <span class="muted">Export</span>
          <div class="seg small" id="export" title="Download the sessions shown, in this order">
            <button data-format="csv">CSV</button>
            <button data-format="json">JSON</button>
          </div>
        </div>
        <div class="toolbar list-filters" id="list-filters"></div>
        <div class="list" id="list"></div>
      </div>
      <div id="project-view" hidden></div>
    </section>
    <aside class="detail-pane" id="detail" hidden></aside>
  </main>

  <div class="modal" id="log-modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <button id="log-back" title="Back to the parent session (b)" hidden>← Parent session</button>
        <strong id="log-title"></strong>
        <div class="spacer"></div>
        <label class="check" title="Stats (s)"><input type="checkbox" id="log-stats-toggle"> Stats</label>
        <label class="check"><input type="checkbox" id="log-thinking"> Thinking</label>
        <label class="check"><input type="checkbox" id="log-meta"> Meta &amp; attachments</label>
        <label class="check" title="Expand tools (e)"><input type="checkbox" id="log-expand"> Expand tools</label>
        <button id="log-close" aria-label="Close">✕</button>
      </div>
      <div class="log-events" id="log-events" hidden></div>
      <div class="log-stats" id="log-stats" hidden></div>
      <div class="log-body" id="log-body" tabindex="-1"></div>
    </div>
  </div>
  <div class="modal" id="help-modal" hidden>
    <div class="modal-box help-box" role="dialog" aria-labelledby="help-title">
      <div class="modal-head">
        <strong id="help-title">Keyboard shortcuts</strong>
        <div class="spacer"></div>
        <button id="help-close" aria-label="Close">✕</button>
      </div>
      <table class="help-keys" id="help-keys"></table>
    </div>
  </div>
  <div class="tooltip" id="tooltip" hidden></div>
</body>
</html>
