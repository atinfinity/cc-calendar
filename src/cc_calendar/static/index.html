<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cc-calendar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='2' width='14' height='13' rx='2' fill='%23d97757'/><rect x='3' y='6' width='4' height='3' fill='white'/><rect x='9' y='9' width='4' height='4' fill='white'/></svg>">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">cc-calendar</div>
    <div class="seg" id="view-toggle">
      <button data-view="calendar">Calendar</button>
      <button data-view="list">List</button>
    </div>
    <input id="search" type="search" placeholder="Search titles and prompts…" autocomplete="off">
    <div class="dropdown" id="project-filter">
      <button class="dropdown-btn" id="project-btn">All projects ▾</button>
      <div class="dropdown-menu" id="project-menu" hidden></div>
    </div>
    <div class="chips" id="status-chips"></div>
    <label class="check"><input type="checkbox" id="hide-noprompt"> Hide sessions without prompts</label>
    <div class="spacer"></div>
    <span class="live" id="live-indicator" title="Live updates">● live</span>
    <button id="reload" title="Reload">Reload</button>
  </header>

  <main class="layout">
    <section class="main-pane">
      <div id="calendar-view">
        <div class="toolbar">
          <div class="seg small" id="span-toggle">
            <button data-span="day">Day</button>
            <button data-span="week">Week</button>
          </div>
          <button id="go-today">This week</button>
          <button id="go-prev" aria-label="Previous">◀</button>
          <button id="go-next" aria-label="Next">▶</button>
          <span class="range" id="range-label"></span>
          <span class="muted" id="range-count"></span>
          <button id="summary-toggle" title="Active time and cost per project">Summary</button>
          <div class="seg small">
            <button id="zoom-out" aria-label="Zoom out">−</button>
            <button id="zoom-in" aria-label="Zoom in">+</button>
            <button id="zoom-reset">Reset</button>
          </div>
          <span class="muted">Color by</span>
          <div class="seg small" id="color-by">
            <button data-color="project">Project</button>
            <button data-color="status">Status</button>
            <button data-color="model">Model</button>
            <button data-color="cost">Cost</button>
          </div>
          <label class="muted">Split after
            <select id="gap">
              <option value="5">5 min</option>
              <option value="10">10 min</option>
              <option value="15">15 min</option>
              <option value="30">30 min</option>
              <option value="60">60 min</option>
            </select>
            idle</label>
        </div>
        <div class="legend" id="legend"></div>
        <div class="summary" id="summary" hidden></div>
        <div class="calendar" id="calendar"></div>
      </div>
      <div id="list-view" hidden>
        <div class="toolbar">
          <span class="muted" id="list-count"></span>
          <span class="muted">Click a column header to sort</span>
        </div>
        <div class="list" id="list"></div>
      </div>
    </section>
    <aside class="detail-pane" id="detail" hidden></aside>
  </main>

  <div class="modal" id="log-modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <button id="log-back" hidden>← Parent session</button>
        <strong id="log-title"></strong>
        <div class="spacer"></div>
        <label class="check"><input type="checkbox" id="log-stats-toggle"> Stats</label>
        <label class="check"><input type="checkbox" id="log-thinking"> Thinking</label>
        <label class="check"><input type="checkbox" id="log-meta"> Meta &amp; attachments</label>
        <label class="check"><input type="checkbox" id="log-expand"> Expand tools</label>
        <button id="log-close" aria-label="Close">✕</button>
      </div>
      <div class="log-events" id="log-events" hidden></div>
      <div class="log-stats" id="log-stats" hidden></div>
      <div class="log-body" id="log-body"></div>
    </div>
  </div>
  <div class="tooltip" id="tooltip" hidden></div>
</body>
</html>
